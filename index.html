<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de precios del market</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Lista de precios</h1>
    <p id="fechaActualizacion"></p>
  </header>
  <main>
    <label class="etiqueta-buscador" for="buscador">Buscar producto</label>
    <input id="buscador" type="search" placeholder="Escribe el nombre del producto" autocomplete="off">
    <div id="filtros" role="group" aria-label="Filtrar por categoría"></div>
    <p id="mensaje" role="status" hidden></p>
    <div id="lista"></div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
